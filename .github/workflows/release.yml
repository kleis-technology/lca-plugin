# Publish the plugin when a tag vX.Y.Z is pushed:
#
# - check that the tag matches lcaacVersion and that CHANGELOG.md has a "## X.Y.Z" section,
# - run tests,
# - sign and publish the plugin to the JetBrains Marketplace,
# - create the GitHub release with the changelog section as notes and the signed archive attached.
#
# Required secrets: PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD.

name: Release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Validate wrapper
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      # Setup Java 17 environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      # Check the tag against the project version, and extract the release notes
      - name: Check Version and Changelog
        id: properties
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^lcaacVersion=' gradle.properties | cut -f2 -d '=')"
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match lcaacVersion=$PROJECT_VERSION in gradle.properties"
            exit 1
          fi

          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' plugin/CHANGELOG.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::No '## $VERSION' section (or an empty one) in plugin/CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Run tests
      - name: Run Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test

      # Sign and publish the plugin to the Marketplace
      - name: Publish Plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :plugin:publishPlugin

      # Create the GitHub release with the signed archive
      # Versions with a pre-release label (e.g. 2.5.0-beta.1) are marked as pre-releases
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.properties.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE \
            plugin/build/distributions/*-signed.zip
